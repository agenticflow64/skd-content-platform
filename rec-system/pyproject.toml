[project]
name = "rec-system"
version = "0.1.0"
description = "Python recommendation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "dependency-injector>=4.41.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "apscheduler>=3.10.0",
    "numpy>=1.26.0",
    "psycopg2-binary>=2.9.11",
    "torch>=2.11.0",
    "transformers>=5.4.0",
    "spacy>=3.8.14",
    "sentence-transformers>=5.3.0",
    "textstat>=0.7.13",
    "aiokafka>=0.13.0",
    "redis[hiredis]>=7.4.0",
    "flagembedding>=1.3.5",
    "python-json-logger>=3.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
eval = [
    "jinja2>=3.1.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.7.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "pytest-html>=4.2.0",
    "fakeredis>=2.34.1",
    "nbformat>=5.10.4",
    "jupyter>=1.1.1",
    "pandas>=3.0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=src",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-report=term-missing:skip-covered",
    "--html=report.html",
    "--self-contained-html",
]
markers = [
    "unit: unit tests (mocked dependencies)",
    "integration: integration tests (real DB and Kafka via testcontainers)",
    "e2e: end-to-end tests (full flow)",
    "slow: tests that take more than 5 seconds each",
    "llm: tests that invoke real Claude CLI",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@abstractmethod",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
