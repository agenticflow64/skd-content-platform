events {
    worker_connections 64;
}

http {
    server {
        listen 18080;

        location / {
            proxy_pass https://api.yookassa.ru;
            proxy_ssl_server_name on;
            proxy_set_header Host api.yookassa.ru;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
