# Unified Platform docker-compose — orchestrates ALL services
# Content-Aggregation (3) + Dedup + Rec + Backend (6) = 12 application services
# Infrastructure: PostgreSQL 17 (pgvector), Valkey, Kafka (KRaft), SeaweedFS

# --- Shared JVM settings for Kotlin/Spring Boot services (Java 21) ---
x-java-env: &java-env
  JAVA_TOOL_OPTIONS: >-
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=100
    -XX:+UseStringDeduplication
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp/heap-dump.hprof
    -XX:MaxRAMPercentage=75.0
    -Dspring.threads.virtual.enabled=true

services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: skd-postgres
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c checkpoint_timeout=30min
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-content_agg_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - /mnt/postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-all.sh:/docker-entrypoint-initdb.d/init-all.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skd-network

  valkey:
    image: valkey/valkey:8-alpine
    container_name: skd-valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - skd-network

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: skd-kafka
    hostname: kafka
    ports:
      - "9092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'BACKEND://kafka:9092,CONTENTAGG://kafka:29092,HOST://0.0.0.0:39092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'BACKEND://kafka:9092,CONTENTAGG://kafka:29092,HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'BACKEND:PLAINTEXT,CONTENTAGG:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'BACKEND'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - skd-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: skd-seaweedfs
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9002:9000"
      - "9003:8888"
    volumes:
      - /mnt/s3_data:/data
      - ./infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status 2>/dev/null | grep -q IsLeader"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - skd-network

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: skd-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Creating content-media bucket...' &&
      echo 's3.bucket.create -name content-media' | weed shell -master=seaweedfs:9333 &&
      echo 'Bucket content-media ready'
      "
    networks:
      - skd-network

  # ============================================================
  # MIGRATIONS — Content Aggregation (Liquibase + Alembic)
  # ============================================================

  config-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-config-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for config schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=config \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./content-aggregation-system/config-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  parser-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-parser-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for data_flow schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=data_flow \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./content-aggregation-system/content-parser-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  dedup-alembic:
    build:
      context: ./dedup-system
      dockerfile: Dockerfile
    container_name: skd-dedup-alembic
    command: uv run alembic upgrade head
    environment:
      DEDUP_DB_DSN: postgresql://postgres:postgres@postgres:5432/content_agg_db?options=-csearch_path%3Ddata_flow
    depends_on:
      parser-liquibase:
        condition: service_completed_successfully
    networks:
      - skd-network

  rec-alembic:
    build:
      context: ./rec-system
      dockerfile: Dockerfile
    container_name: skd-rec-alembic
    command: uv run alembic upgrade rec_data_flow@head
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_agg_db
    depends_on:
      parser-liquibase:
        condition: service_completed_successfully
    networks:
      - skd-network

  # ============================================================
  # MIGRATIONS — Backend (Liquibase)
  # ============================================================

  auth-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-auth-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for auth schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=auth \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./backend/auth-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  user-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-user-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for users schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=users \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./backend/user-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  interactions-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-interactions-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for interactions schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=interactions \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./backend/user-interactions-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  subscription-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-subscription-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for subscription schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=subscription \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./backend/subscription-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  feed-liquibase:
    image: liquibase/liquibase:latest
    container_name: skd-feed-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /changelog
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Downloading PostgreSQL driver..." && \
        wget -q -O /liquibase/internal/lib/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar && \
        echo "Applying migrations for feed schema..." && \
        liquibase --classpath=/liquibase/internal/lib/postgresql.jar \
          --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-content_agg_db} \
          --username=${POSTGRES_USER:-postgres} \
          --password=${POSTGRES_PASSWORD:-postgres} \
          --defaultSchemaName=feed \
          --changeLogFile=changelog.yaml \
          update
    volumes:
      - ./backend/feed-service/src/main/resources/changelog:/changelog:ro
    networks:
      - skd-network

  # ============================================================
  # CONTENT AGGREGATION SERVICES
  # ============================================================

  config-service:
    build:
      context: ./content-aggregation-system/config-service
      dockerfile: Dockerfile
    container_name: skd-config-service
    ports:
      - "18081:8081"
    env_file:
      - ./content-aggregation-system/config-service/.env
    environment:
      <<: *java-env
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      config-liquibase:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - skd-network

  content-parser-service:
    build:
      context: ./content-aggregation-system/content-parser-service
      dockerfile: Dockerfile
    container_name: skd-parser-service
    ports:
      - "18082:8082"
    env_file:
      - ./content-aggregation-system/content-parser-service/.env
    environment:
      <<: *java-env
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      S3_ENDPOINT: http://seaweedfs:9000
      S3_PUBLIC_URL: http://seaweedfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-adminsecretkey}
      CONFIG_SERVICE_URL: http://config-service:8081
      TELEGRAM_ENABLED: "true"
    depends_on:
      parser-liquibase:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    volumes:
      - telegram-session-data:/app/telegram-session
    networks:
      - skd-network

  content-aggregator-service:
    build:
      context: ./content-aggregation-system/content-aggregator-service
      dockerfile: Dockerfile
    container_name: skd-aggregator-service
    ports:
      - "8086:8086"
    env_file:
      - ./content-aggregation-system/content-aggregator-service/.env
    environment:
      <<: *java-env
      DB_HOST: postgres
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9002}
    depends_on:
      parser-liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      skd-network:
        aliases:
          - content-aggregation-system

  # ============================================================
  # ML WORKERS
  # ============================================================

  dedup-worker:
    build:
      context: ./dedup-system
      dockerfile: Dockerfile
    container_name: skd-dedup-worker
    command: uv run python -m src.presentation.worker_runner
    runtime: nvidia
    privileged: true
    environment:
      DEDUP_DB_DSN: postgresql://postgres:postgres@postgres:5432/content_agg_db?options=-csearch_path%3Ddata_flow
      DEDUP_MODEL_NAME: ${DEDUP_MODEL_NAME:-BAAI/bge-m3}
      DEDUP_POLL_INTERVAL: ${DEDUP_POLL_INTERVAL:-0.2}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      CUDA_MEM_FRACTION: "0.60"
    depends_on:
      dedup-alembic:
        condition: service_completed_successfully
    volumes:
      - dedup-model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - skd-network

  rec-worker:
    build:
      context: ./rec-system
      dockerfile: Dockerfile
    container_name: skd-rec-worker
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000
    runtime: nvidia
    privileged: true
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/content_agg_db
      REDIS_URL: redis://valkey:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_VERSION: "1.2.0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REC_MAX_NLP_TOKENS: ${REC_MAX_NLP_TOKENS:-512}
      REC_MAX_CLEAN_TEXT_BYTES: ${REC_MAX_CLEAN_TEXT_BYTES:-1048576}
      REC_TRUNCATE_TEXT_BYTES: ${REC_TRUNCATE_TEXT_BYTES:-524288}
    depends_on:
      rec-alembic:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - rec-model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - skd-network

  # ============================================================
  # BACKEND MICROSERVICES
  # ============================================================

  auth-service:
    build: ./backend/auth-service
    container_name: skd-auth-service
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-liquibase:
        condition: service_completed_successfully
    environment:
      <<: *java-env
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-content_agg_db}
      DB_SCHEMA: auth
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: valkey
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      GATEWAY_HMAC_SECRET: ${GATEWAY_HMAC_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - skd-network

  user-service:
    build: ./backend/user-service
    container_name: skd-user-service
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-liquibase:
        condition: service_completed_successfully
      rec-worker:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-content_agg_db}
      DB_SCHEMA: users
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      GATEWAY_HMAC_SECRET: ${GATEWAY_HMAC_SECRET}
      REC_SYSTEM_URL: ${REC_SYSTEM_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - skd-network

  user-interactions-service:
    build: ./backend/user-interactions-service
    container_name: skd-user-interactions-service
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      interactions-liquibase:
        condition: service_completed_successfully
    environment:
      <<: *java-env
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-content_agg_db}
      DB_SCHEMA: interactions
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      GATEWAY_HMAC_SECRET: ${GATEWAY_HMAC_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - skd-network

  yookassa-proxy:
    image: nginx:alpine
    container_name: skd-yookassa-proxy
    network_mode: host
    volumes:
      - ./backend/infrastructure/yookassa-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18080/v3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  subscription-service:
    build: ./backend/subscription-service
    container_name: skd-subscription-service
    ports:
      - "8084:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      subscription-liquibase:
        condition: service_completed_successfully
    environment:
      <<: *java-env
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-content_agg_db}
      DB_SCHEMA: subscription
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      GATEWAY_HMAC_SECRET: ${GATEWAY_HMAC_SECRET}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_API_URL: http://host.docker.internal:18080/v3
      YOOKASSA_WEBHOOK_DEV_MODE: ${YOOKASSA_WEBHOOK_DEV_MODE}
      FRONTEND_URL: ${FRONTEND_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - skd-network

  feed-service:
    build: ./backend/feed-service
    container_name: skd-feed-service
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
      feed-liquibase:
        condition: service_completed_successfully
      rec-worker:
        condition: service_healthy
      content-aggregator-service:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-content_agg_db}
      DB_SCHEMA: feed
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: valkey
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      GATEWAY_HMAC_SECRET: ${GATEWAY_HMAC_SECRET}
      SERVICES_REC_SYSTEM_URL: ${SERVICES_REC_SYSTEM_URL}
      SERVICES_CONTENT_AGGREGATION_URL: ${SERVICES_CONTENT_AGGREGATION_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - skd-network

  api-gateway:
    build: ./backend/api-gateway
    container_name: skd-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      valkey:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      <<: *java-env
      REDIS_HOST: valkey
      REDIS_PORT: ${REDIS_PORT}
      GATEWAY_HMAC_SECRET: ${GATEWAY_HMAC_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CORS_ALLOW_LOCALHOST_WILDCARD: ${CORS_ALLOW_LOCALHOST_WILDCARD:-false}
      SPRING_PROFILES_ACTIVE: unified
    volumes:
      - ./infrastructure/gateway/application-unified.yml:/app/config/application-unified.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - skd-network

volumes:
  dedup-model-cache:
    driver: local
  rec-model-cache:
    driver: local
  telegram-session-data:
    driver: local

networks:
  skd-network:
    driver: bridge
