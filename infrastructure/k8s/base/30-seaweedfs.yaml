apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: skd
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "anonymous",
          "actions": [
            "Read:content-media",
            "List:content-media"
          ]
        },
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "admin",
              "secretKey": "adminsecretkey"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: skd
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: skd
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: filer
      port: 8888
      targetPort: 8888
    - name: master
      port: 9333
      targetPort: 9333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: skd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - server
            - "-s3"
            - "-s3.port=9000"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-dir=/data"
          ports:
            - name: s3
              containerPort: 9000
            - name: filer
              containerPort: 8888
            - name: master
              containerPort: 9333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "wget -qO- http://127.0.0.1:9333/cluster/status 2>/dev/null | grep -q IsLeader"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 1
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-init-bucket
  namespace: skd
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local http://seaweedfs:9000 admin adminsecretkey; do
                echo "waiting for seaweedfs..."; sleep 3;
              done
              mc mb local/content-media --ignore-existing
              mc anonymous set download local/content-media || true
              echo "bucket content-media ready"
