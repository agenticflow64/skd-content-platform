apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: skd
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: backend
      port: 9092
      targetPort: 9092
    - name: contentagg
      port: 29092
      targetPort: 29092
    - name: external
      port: 29093
      targetPort: 29093
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: skd
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.9.0
          ports:
            - name: backend
              containerPort: 9092
            - name: contentagg
              containerPort: 29092
            - name: external
              containerPort: 29093
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://kafka-0.kafka.skd.svc.cluster.local:9093,BACKEND://0.0.0.0:9092,CONTENTAGG://0.0.0.0:29092,EXTERNAL://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "BACKEND://kafka:9092,CONTENTAGG://kafka:29092,EXTERNAL://k3d-skd-server-0:30293"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.skd.svc.cluster.local:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "BACKEND:PLAINTEXT,CONTENTAGG:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "BACKEND"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "10485760"
            - name: KAFKA_NUM_PARTITIONS
              value: "4"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1536Mi
              cpu: 2
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
