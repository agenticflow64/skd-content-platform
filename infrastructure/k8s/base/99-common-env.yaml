apiVersion: v1
kind: ConfigMap
metadata:
  name: common-env
  namespace: skd
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "content_agg_db"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  S3_ENDPOINT: "http://seaweedfs:9000"
  S3_PUBLIC_URL: "http://seaweedfs:9000"
  S3_ACCESS_KEY: "admin"
  S3_SECRET_KEY: "adminsecretkey"
  S3_BUCKET: "content-media"
  S3_REGION: "us-east-1"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  REDIS_HOST: "valkey"
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: "valkey"
  SPRING_DATA_REDIS_PORT: "6379"
  JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError"
  SPRING_LIQUIBASE_CHANGE_LOG: "classpath:/changelog/changelog.yaml"
