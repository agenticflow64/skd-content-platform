# NodePort Services exposing infra to external ML workers (docker-compose)
# and potentially to the host for debugging via Freelens port-forward.
# Internal cluster Services (postgres, kafka, valkey) stay as ClusterIP/Headless;
# these are SECONDARY Services with NodePort.

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ext
  namespace: skd
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ext
  namespace: skd
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: backend
      port: 9092
      targetPort: 9092
      nodePort: 30092
    - name: contentagg
      port: 29092
      targetPort: 29092
      nodePort: 30292
    - name: external
      port: 29093
      targetPort: 29093
      nodePort: 30293
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-ext
  namespace: skd
spec:
  type: NodePort
  selector:
    app: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379
