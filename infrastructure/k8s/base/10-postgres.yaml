apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: skd
data:
  init-all.sh: |
    #!/bin/bash
    set -e
    echo "=== Initializing content_agg_db schemas and extensions ==="
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE SCHEMA IF NOT EXISTS config;
        CREATE SCHEMA IF NOT EXISTS data_flow;
        CREATE EXTENSION IF NOT EXISTS vector SCHEMA data_flow;
        CREATE SCHEMA IF NOT EXISTS auth;
        CREATE SCHEMA IF NOT EXISTS users;
        CREATE SCHEMA IF NOT EXISTS interactions;
        CREATE SCHEMA IF NOT EXISTS subscription;
        CREATE SCHEMA IF NOT EXISTS feed;
        GRANT ALL ON SCHEMA config TO $POSTGRES_USER;
        GRANT ALL ON SCHEMA data_flow TO $POSTGRES_USER;
        GRANT ALL ON SCHEMA auth TO $POSTGRES_USER;
        GRANT ALL ON SCHEMA users TO $POSTGRES_USER;
        GRANT ALL ON SCHEMA interactions TO $POSTGRES_USER;
        GRANT ALL ON SCHEMA subscription TO $POSTGRES_USER;
        GRANT ALL ON SCHEMA feed TO $POSTGRES_USER;
    EOSQL
    echo "=== All schemas initialized successfully ==="
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: skd
type: Opaque
stringData:
  POSTGRES_DB: content_agg_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skd
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: skd
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          args:
            - postgres
            - "-c"
            - "max_connections=300"
            - "-c"
            - "shared_buffers=256MB"
            - "-c"
            - "effective_cache_size=1GB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "checkpoint_timeout=30min"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 2
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
