apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: skd
spec:
  selector:
    app: config-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: skd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: skd-config-service:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: common-env
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_LIQUIBASE_ENABLED
              value: "true"
            - name: SPRING_LIQUIBASE_CHANGE_LOG
              value: "classpath:/changelog/changelog.yaml"
            - name: SPRING_LIQUIBASE_DEFAULT_SCHEMA
              value: "config"
            - name: PARSER_SERVICE_URL
              value: "http://parser-tg:8082"
            - name: LOG_LEVEL_ROOT
              value: "INFO"
            - name: LOG_LEVEL_APP
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 1
