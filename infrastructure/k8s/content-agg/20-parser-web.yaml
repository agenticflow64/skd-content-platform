apiVersion: v1
kind: Service
metadata:
  name: parser-web
  namespace: skd
spec:
  selector:
    app: parser-web
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-web
  namespace: skd
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: parser-web
  template:
    metadata:
      labels:
        app: parser-web
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: parser-web
          image: skd-content-parser-service:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: common-env
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_LIQUIBASE_ENABLED
              value: "true"
            - name: LIQUIBASE_CONTEXTS
              value: "production"
            - name: TELEGRAM_ENABLED
              value: "false"
            - name: PARSER_ENABLED_SOURCE_TYPES
              value: "HABR,VCRU"
            - name: PARSER_QUARTZ_THREAD_COUNT
              value: "10"
            - name: LOG_LEVEL_ROOT
              value: "INFO"
            - name: LOG_LEVEL_APP
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1280Mi
              cpu: 1500m
