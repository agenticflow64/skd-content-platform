apiVersion: v1
kind: Secret
metadata:
  name: telegram-credentials
  namespace: skd
type: Opaque
stringData:
  TELEGRAM_API_ID: "27277752"
  TELEGRAM_API_HASH: "2132a36f9f376dd46107be00ca2c7efe"
  TELEGRAM_PHONE_NUMBER: "+79939466394"
  TELEGRAM_ADMIN_TOKEN: "test-admin-token"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-session
  namespace: skd
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: parser-tg
  namespace: skd
spec:
  selector:
    app: parser-tg
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-tg
  namespace: skd
spec:
  replicas: 1
  strategy:
    type: Recreate  # NEVER run two TDLib processes on same session
  selector:
    matchLabels:
      app: parser-tg
  template:
    metadata:
      labels:
        app: parser-tg
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: parser-tg
          image: skd-content-parser-service:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: common-env
            - secretRef:
                name: telegram-credentials
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_LIQUIBASE_ENABLED
              value: "false"  # parser-web already runs migrations
            - name: TELEGRAM_ENABLED
              value: "true"
            - name: TELEGRAM_SESSION_PATH
              value: "/app/telegram-session"
            - name: PARSER_ENABLED_SOURCE_TYPES
              value: "TELEGRAM"
            - name: LOG_LEVEL_ROOT
              value: "INFO"
            - name: LOG_LEVEL_APP
              value: "INFO"
          volumeMounts:
            - name: tg-session
              mountPath: /app/telegram-session
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 20  # TDLib auth can be slow
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1280Mi
              cpu: 1500m
      volumes:
        - name: tg-session
          persistentVolumeClaim:
            claimName: telegram-session
