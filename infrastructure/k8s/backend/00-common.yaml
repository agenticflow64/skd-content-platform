apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: skd
type: Opaque
stringData:
  GATEWAY_HMAC_SECRET: "super-secret-hmac-key-for-dev"
  YOOKASSA_SHOP_ID: "1319633"
  YOOKASSA_SECRET_KEY: "test_gfuDLy-WLYsJH6BUqGM4ds7OqhpQyaX3TUedxSFXBms"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-env
  namespace: skd
data:
  DB_HOST: "postgres"
  DB_NAME: "content_agg_db"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "valkey"
  REDIS_PORT: "6379"
  FRONTEND_URL: "http://localhost:3000"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
  CORS_ALLOW_LOCALHOST_WILDCARD: "true"
  AUTH_DEV_MODE: "true"
  SMTP_HOST: "localhost"
  SMTP_PORT: "587"
  REC_SYSTEM_URL: "http://rec-worker:8000"
  SERVICES_REC_SYSTEM_URL: "http://rec-worker:8000"
  SERVICES_CONTENT_AGGREGATION_URL: "http://content-aggregator:8086"
  YOOKASSA_API_URL: "http://yookassa-proxy:18080/v3"
  YOOKASSA_RETURN_URL: "http://localhost:3000/#/subscription"
  YOOKASSA_WEBHOOK_DEV_MODE: "true"
  YOOKASSA_CONNECT_TIMEOUT_MS: "5000"
  YOOKASSA_READ_TIMEOUT_MS: "20000"
  GATEWAY_DEFAULT_TIMEOUT_MS: "25000"
  SPRING_LIQUIBASE_ENABLED: "true"
  SPRING_LIQUIBASE_CHANGE_LOG: "classpath:/changelog/changelog.yaml"
  JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: skd
data:
  application-unified.yml: |
    gateway:
      routes:
        - path-prefix: /api/auth
          target: http://auth-service:8080
          public: true
          strip-prefix: false
        - path-prefix: /api/users
          target: http://user-service:8080
          strip-prefix: false
        - path-prefix: /api/feed
          target: http://feed-service:8080
          strip-prefix: false
        - path-prefix: /api/interactions
          target: http://user-interactions-service:8080
          strip-prefix: false
        - path-prefix: /api/subscription
          target: http://subscription-service:8080
          strip-prefix: false
        - path-prefix: /webhook/yookassa
          target: http://subscription-service:8080
          public: true
          strip-prefix: false
        - path-prefix: /api/sources
          target: http://config-service:8081
          strip-prefix: false
        - path-prefix: /api/config
          target: http://config-service:8081
          strip-prefix: false
          required-roles:
            - SUBSCRIBER
