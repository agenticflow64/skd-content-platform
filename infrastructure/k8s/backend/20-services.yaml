# All 5 backend microservices. Each uses the shared backend-env ConfigMap +
# backend-secrets Secret + has DB_SCHEMA specific to the service.
# Spring Liquibase runs on startup (single replica each, so no race).

---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: skd }
spec:
  selector: { app: auth-service }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: skd }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: skd-auth-service:latest
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: backend-env }
            - secretRef: { name: backend-secrets }
          env:
            - { name: DB_SCHEMA, value: "auth" }
            - { name: SPRING_LIQUIBASE_DEFAULT_SCHEMA, value: "auth" }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 40, periodSeconds: 10, failureThreshold: 15 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 120, periodSeconds: 30 }
          resources: { requests: { memory: 384Mi, cpu: 100m }, limits: { memory: 768Mi, cpu: 1 } }

