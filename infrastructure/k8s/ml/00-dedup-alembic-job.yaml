apiVersion: batch/v1
kind: Job
metadata:
  name: dedup-alembic
  namespace: skd
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: alembic
          image: skd-dedup-worker:latest
          imagePullPolicy: Never
          command: ["uv", "run", "alembic", "upgrade", "head"]
          env:
            - name: DEDUP_DB_DSN
              value: "postgresql://postgres:postgres@postgres:5432/content_agg_db?options=-csearch_path%3Ddata_flow"
